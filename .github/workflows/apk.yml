name: APK oluştur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Sonraki sürümlerde aynı kurulum imzasını koru
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: temiz-sec-debug-signing-explicit-v1
      - name: Kurulum anahtarını hazırla
        run: bash scripts/prepare-debug-key.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle ve denetimleri çalıştır
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: APK imzasını doğrula
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Temiz-Sec.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Temiz-Sec.apk
          sha256sum Temiz-Sec.apk > Temiz-Sec.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Temiz-Sec-APK
          path: |
            Temiz-Sec.apk
            Temiz-Sec.apk.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Temiz-Sec-APK
      - name: Doğrudan APK indirme bağlantısını yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.1.0 Temiz-Sec.apk Temiz-Sec.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v3.1.0 Temiz-Sec.apk Temiz-Sec.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Temiz Seç 3.1.0" --notes "Tarama artık ekrandan bağımsız, bildirimli bir arka plan hizmetinde çalışır. Açılışta otomatik yeniden tarama kaldırıldı. Klasör ilerlemesi, tamamlanan içerik karşılaştırmaları ve bitmiş sonuçlar cihazda saklanır. Kesinti sonrası Devam et seçeneği kullanılır. Bildirimden veya uygulamadan duraklatılabilir. 3.0.1 ile aynı imza önbelleği kullanılır. Üretici güç kısıtlamaları görevi yine kapatabilir; kayıtlı kontrol noktalarından devam edilir."
          fi
