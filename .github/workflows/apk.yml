name: APK oluştur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Sonraki sürümlerde aynı kurulum imzasını koru
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: temiz-sec-debug-signing-v2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle ve denetimleri çalıştır
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: APK imzasını doğrula
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Temiz-Sec.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Temiz-Sec.apk
          sha256sum Temiz-Sec.apk > Temiz-Sec.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Temiz-Sec-APK
          path: |
            Temiz-Sec.apk
            Temiz-Sec.apk.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Temiz-Sec-APK
      - name: Doğrudan APK indirme bağlantısını yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.0.0 Temiz-Sec.apk Temiz-Sec.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v3.0.0 Temiz-Sec.apk Temiz-Sec.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Temiz Seç 3.0" --notes "İçerik karşılaştırmasıyla birebir kopya fotoğraf, video ve dosyalar. Boyuttan bağımsız görsel benzerliğiyle fotoğraf adayları. Eski, geçici/boş ve büyük dosyalar ayrı kategorilerde. Korunan dosyalar toplu seçimde atlanır, otomatik silme yoktur. Android özel uygulama klasörleri kapsam dışı. 2.0 ile aynı imza önbelleği kullanılır. Benzerlik ve gereksizlik sonuçları kontrol gerektiren adaylardır. Fiziksel cihaz testi henüz yapılmadı."
          fi
